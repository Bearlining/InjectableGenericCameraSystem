name: Build IGCS TEW2 Camera Tools

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'

      - name: List TEW2 project files
        run: |
          Write-Host "=== .sln files in TEW2 ==="
          Get-ChildItem -Path "Cameras\TEW2" -Recurse -Filter "*.sln" -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== .vcxproj files in TEW2 ==="
          Get-ChildItem -Path "Cameras\TEW2" -Recurse -Filter "*.vcxproj" -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Build TEW2 Camera (Release/x64)
        run: |
          msbuild Cameras\TEW2\CameraTools.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /m `
            /v:detailed
        working-directory: ${{ github.workspace }}

      - name: List TEW2 build outputs
        run: |
          Write-Host "=== All DLLs under Cameras\TEW2 ==="
          Get-ChildItem -Path "Cameras\TEW2" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host "=== All EXEs under Cameras\TEW2 ==="
          Get-ChildItem -Path "Cameras\TEW2" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Build IGCSInjector (Release/x64)
        run: |
          msbuild Tools\IGCSInjector\IGCSInjector.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsTargetPlatformVersion=10.0.26100.0 `
            /m `
            /v:detailed
        working-directory: ${{ github.workspace }}

      - name: List injector build outputs
        run: |
          Write-Host "=== IGCSInjector files ==="
          Get-ChildItem -Path "Tools\IGCSInjector" -Recurse -Filter "IGCSInjector.*" -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Prepare artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist
          
          $tew2 = Get-ChildItem -Path "Cameras\TEW2" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($tew2) { 
            Copy-Item $tew2.FullName -Destination "dist\TEW2CameraTools.dll" -Force 
            Write-Host "TEW2 DLL: $($tew2.FullName) ($($tew2.Length) bytes)"
          } else { 
            Write-Error "TEW2 DLL not found in Cameras\TEW2"
            exit 1 
          }
          
          $exe = Get-ChildItem -Path . -Recurse -Filter "IGCSInjector.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) { 
            Copy-Item $exe.FullName -Destination "dist\IGCSInjector.exe" -Force 
            Write-Host "Injector EXE: $($exe.FullName)"
          } else { 
            Write-Error "IGCSInjector.exe NOT FOUND"
            exit 1 
          }
          
          $ini = Get-ChildItem -Path . -Recurse -Filter "IGCSInjector.ini" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ini) { 
            Copy-Item $ini.FullName -Destination "dist\IGCSInjector.ini" -Force 
          }
          
          Write-Host "=== Final artifacts ==="
          Get-ChildItem dist
        working-directory: ${{ github.workspace }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: igcs-tew2-build
          path: dist/*
          if-no-files-found: warn
          retention-days: 7
